site_name: Weaver documentation
site_description: Technical documentation for Weaver
site_url: https://docs.weaverstack.dev
repo_name: matthias-wong-dev/weaverstack-docs
repo_url: https://github.com/matthias-wong-dev/weaverstack-docs
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Installation: get-started/installation.md
      - First project: get-started/first-project.md
  - Guides:
      - guides/index.md
      - Lakehouse pipeline: guides/lakehouse-pipeline.md
      - Warehouse pipeline: guides/warehouse-pipeline.md
      - Incremental loads: guides/incremental-loads.md
      - Shortcuts: guides/shortcuts.md
      - Validation: guides/validation.md
      - Workspaces and Environments: guides/environments.md
  - Core concepts:
      - core-concepts/index.md
      - How Weaver works: core-concepts/how-weaver-works.md
      - Projects and estates: core-concepts/projects-and-estates.md
      - Logical and physical items: core-concepts/logical-and-physical-items.md
      - Weaver documents: core-concepts/weaver-documents.md
      - Weaver operations: core-concepts/weaver-operations.md
      - Weaver catalogue: core-concepts/catalogue.md
      - Development cycle: core-concepts/development-cycle.md
      - Dependencies: core-concepts/dependencies.md
      - Fault tolerance: core-concepts/fault-tolerance.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
  - Contracts:
      - contracts/index.md
      - Load: contracts/load.md
  - Advanced: advanced/index.md
  - Contributing: contributing/index.md
