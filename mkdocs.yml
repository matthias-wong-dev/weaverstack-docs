site_name: Weaver documentation
site_description: Technical documentation for Weaver
site_url: https://docs.weaverstack.dev
repo_name: matthias-wong-dev/weaverstack-docs
repo_url: https://github.com/matthias-wong-dev/weaverstack-docs
edit_uri: edit/main/docs/
strict: true

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.annotate
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest

plugins:
  - search:
      lang: en

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - assets/stylesheets/extra.css

nav:
  - Home: index.md
  - Get started:
      - get-started/index.md
      - Installation: get-started/installation.md
      - First project: get-started/first-project.md
  - Guides: guides/index.md
  - Architecture and concepts:
      - concepts/index.md
      - Architecture: concepts/architecture.md
  - Reference:
      - reference/index.md
      - CLI: reference/cli.md
  - Contracts: contracts/index.md
  - Advanced: advanced/index.md
  - Contributing: contributing/index.md
  - Documentation gaps: gaps.md
